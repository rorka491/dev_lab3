[project]
name = "lab3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "dishka>=1.10.1",
    "fastapi>=0.142.2",
    "fastapi-pagination>=0.16.1",
    "fastcrud>=0.22.3",
    "faststream[redis]>=0.7.7",
    "greenlet>=3.5.6",
    "ipython>=9.17.1",
    "pwdlib>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"